<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Act Q&amp;A</title>
<style>
  :root { --text: #1d1d1f; --muted: #6b6b70; --line: #e2e2e6; --accent: #1f4fbf; --bg: #ffffff; --soft: #f5f6f8; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #ececf0; --muted: #9a9aa3; --line: #34343a; --accent: #8fb0ff; --bg: #161618; --soft: #202024; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .note { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
  textarea { width: 100%; min-height: 84px; padding: 12px; font: inherit; color: inherit; background: var(--soft);
             border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  button { margin-top: 10px; padding: 9px 18px; font: inherit; color: #fff; background: var(--accent);
           border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { color: var(--muted); margin-top: 20px; }
  ol { padding-left: 1.3rem; }
  li { margin-bottom: 10px; }
  .cite { white-space: nowrap; margin-left: 6px; font-size: 0.9rem; }
  a { color: var(--accent); }
  .abstained { padding: 12px 14px; background: var(--soft); border-left: 3px solid var(--muted); border-radius: 4px; }
  details { margin-top: 20px; color: var(--muted); font-size: 0.9rem; }
  details li { margin-bottom: 2px; }
</style>
</head>
<body>
<main>
  <h1>AI Act Q&amp;A</h1>
  <p class="note">Answers come only from the text of the EU AI Act, with a link to each cited article. Check the sources before relying on an answer.</p>

  <form id="form">
    <textarea id="question" placeholder="e.g. How much can a company be fined for a prohibited AI practice?" required minlength="3" maxlength="1000"></textarea>
    <button id="ask" type="submit">Ask</button>
  </form>

  <div id="status"></div>
  <div id="answer"></div>
</main>

<script>
  const form = document.getElementById("form");
  const question = document.getElementById("question");
  const button = document.getElementById("ask");
  const status = document.getElementById("status");
  const answer = document.getElementById("answer");

  function element(tag, text, attributes = {}) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  }

  function render(result) {
    answer.replaceChildren();
    if (result.abstained || !result.valid_answer) {
      answer.append(element("p", "The AI Act sources found do not answer this question.", { class: "abstained" }));
    } else {
      const list = element("ol");
      for (const claim of result.claims) {
        const item = element("li", claim.text);
        for (const citation of claim.citations) {
          const link = element("a", citation.citation, { href: citation.url, target: "_blank", rel: "noopener" });
          const wrapper = element("span", null, { class: "cite" });
          wrapper.append("[", link, "]");
          item.append(wrapper);
        }
        list.append(item);
      }
      answer.append(list);
    }

    const details = element("details");
    const s = result.seconds;
    details.append(element("summary", `${s.total.toFixed(1)} s, ${result.sources.length} sources in the context`));
    details.append(element("p", `retrieval ${s.retrieval.toFixed(2)} s, reranker ${s.rerank.toFixed(2)} s, ` +
      `prompt ${s.prompt.toFixed(2)} s, generation ${s.generation.toFixed(2)} s. Request ${result.request_id}`));
    const sources = element("ol");
    for (const source of result.sources) {
      const item = element("li");
      item.append(element("a", source.citation, { href: source.url, target: "_blank", rel: "noopener" }),
                  ` reranker score ${source.rerank_score}`);
      sources.append(item);
    }
    details.append(sources);
    answer.append(details);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    answer.replaceChildren();
    status.textContent = "Searching the AI Act and writing the answer…";
    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question.value.trim() }),
      });
      if (!response.ok) throw new Error(`the service answered ${response.status}`);
      render(await response.json());
      status.textContent = "";
    } catch (error) {
      status.textContent = `Something went wrong: ${error.message}.`;
    } finally {
      button.disabled = false;
    }
  });

  question.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) form.requestSubmit();
  });
</script>
</body>
</html>

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama:
    image: ollama/ollama:0.40.5
    <<: *gpu
    environment:
      # Keeps the generator in memory: otherwise it is unloaded after 5 idle minutes and reloaded on the next question.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:0.40.5
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma3:12b"]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    <<: *gpu
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - hf-cache:/cache/huggingface
      - embeddings:/app/data/embeddings
      - ./logs:/app/logs
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 5

volumes:
  ollama-models:
  hf-cache:
  embeddings:
